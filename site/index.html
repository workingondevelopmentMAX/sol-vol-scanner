<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOL Vol Scanner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a19">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script src="charts.js"></script>
<script src="data/data.js"></script>
<script src="data/private/data.js"></script><!-- only exists on your own computer (private limits); ignored by Git -->
<script>
(async function () {
  let D = window.SCANNER_PRIVATE_DATA || window.SCANNER_DATA;
  const PRIVATE = !!window.SCANNER_PRIVATE_DATA;
  if (!D) { try { D = await (await fetch("data/latest.json", {cache:"no-store"})).json(); } catch (e) {} }
  const app = document.getElementById("app");
  if (!D || !D.latest) {
    app.innerHTML = `<div class="card"><h2>No data yet</h2><p>Run <b>run_scan.bat</b> on the laptop once, then reload.</p>
      ${D && D.error ? `<p class="muted">Last error: ${esc(D.error)}</p>` : ""}</div>`;
    return;
  }
  const L = D.latest, V = L.verdict, S = L.suggestion;
  const pct = x => x == null ? "n/a" : (x * 100).toFixed(1) + "%";
  const usd = (x, d = 2) => x == null ? "n/a" : (x < 0 ? "-$" : "$") + Math.abs(x).toLocaleString(undefined, {minimumFractionDigits:d, maximumFractionDigits:d});
  const sgt = iso => new Date(iso).toLocaleString("en-SG", {timeZone:"Asia/Singapore", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
  function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  function whyBlock(S) {
    const C = S.conviction, Y = S.why;
    if (!C || !Y) return "";
    const low = C.label === "Low";
    return `<div class="why">
      <div class="conv ${C.label}"><div class="conv-top"><span class="lbl">Conviction: ${C.label}</span><span class="sc">${C.score}/100</span></div>
        <div class="meter" role="img" aria-label="Conviction ${C.score} out of 100"><b style="width:${C.score}%"></b><i style="left:${D.config?.conviction?.medium ?? 45}%"></i><i style="left:${D.config?.conviction?.high ?? 70}%"></i></div>
        <div class="conv-act"><b>${esc(C.action)}</b></div>
        ${C.caps.map(c => `<div class="muted">${esc(c)}</div>`).join("")}
        <details><summary>What drives the score</summary><table class="parts">
          ${C.parts.map(p => `<tr><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.why)}</span></td><td class="pt">${Math.round(p.weight * p.score)} / ${p.weight}</td></tr>`).join("")}
        </table></details></div>
      ${low ? `<p class="muted" style="margin:10px 0 0">It is fine not to trade. Below is why the rules picked this spread, so you can see what is missing.</p>` : ""}
      <h3>${low ? "Why it was considered" : "Why this trade"}: market conditions</h3><ul>${Y.market.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      <h3>How it fits your plan</h3><ul>${Y.goals.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
    </div>`;
  }

  const ageH = (Date.now() - new Date(D.last_good_at || L.generated_at)) / 36e5;
  const R = L.report || null;                         // the page's explanations, all worked out in Python
  let html = `<header><h1>SOL Vol Scanner</h1><div class="upd">Updated ${sgt(D.last_good_at || L.generated_at)} SGT<br>SOL ${usd(L.index_price)} · <a href="lab.html" style="color:inherit">Strategy Lab</a></div></header>`;
  if (PRIVATE) html += `<div class="banner info"><b>Private view</b> from this computer's last scan, sized with your own limits. Run run_scan.bat to refresh it; the online dashboard shows the generic $1,000 reference instead.</div>`;
  if (D.sample) html += `<div class="banner info"><b>Sample data.</b> These numbers are synthetic, made for testing. Run the scanner for real data.</div>`;
  if (D.status === "error") html += `<div class="banner warn"><b>Stale data.</b> The last run failed (${esc(D.error)}). Showing data from ${sgt(D.last_good_at)} SGT.</div>`;
  else if (ageH > 36 && !D.sample) html += `<div class="banner warn"><b>Stale data.</b> Last update was ${Math.round(ageH)} hours ago. Is the laptop's daily task running?</div>`;
  if (L.checks && L.checks.price_units && L.checks.price_units.ok === false) html += `<div class="banner warn">${esc(L.checks.price_units.note)}</div>`;
  if (R) R.banners.forEach(b => { html += `<div class="banner warn">${esc(b.text)}</div>`; });

  // ---- 1. today at a glance: every strategy on the menu
  if (R) {
    const G = R.glance;
    html += `<section class="card a-glance"><h2><span class="step">1</span>Today at a glance</h2>
      <p class="glance-line">${esc(G.line)}</p>
      <div class="glance">${G.rows.map(r => `<div class="grow ${r.status}">
        <div class="gn">${r.card ? `<a href="#${r.card}">${esc(r.name)}</a>` : esc(r.name)}<span class="chip">${esc(r.status.replace("_", " "))}</span></div>
        <div class="gm">for ${esc(r.market_text)}</div>
        <div class="gt">${esc(r.text)}${r.card ? ` <a href="#${r.card}">See the idea ↓</a>` : ""}</div></div>`).join("")}</div>
      ${G.footer ? `<div class="glance-foot">${esc(G.footer)}</div>` : ""}</section>`;
  }

  // ---- 2. today's idea card(s): one per suggested strategy (built from its entry in L.strategies)
  const cardOf = id => (R ? R.cards.find(c => c.id === id) : null);
  function evidenceBox(C) {
    if (!C.evidence) return `<div class="box"><h3>How much to trust this rule</h3><p class="muted">${esc(C.evidence_missing)}</p></div>`;
    const E = C.evidence;
    return `<div class="box"><h3>How much to trust this rule</h3>
      <div class="ev-title ${E.label}${E.thin ? " thin" : ""}">${esc(E.title)}</div><div class="muted">${esc(E.meaning)}</div>
      <div class="ev-cols">${E.windows.map(w => `<div class="ev-col ${w.key}"><h4>${esc(w.title)}</h4><div class="muted">${esc(w.label)}</div>
        <div class="kv">${w.rows.map(r => `<div class="k">${esc(r.name)}</div><div class="v${r.value != null && ["total_per_1000","avg_per_1000","hold_sol","dca_sol"].includes(r.key) ? (r.value >= 0 ? " pos" : " neg") : ""}">${esc(r.text)}</div>`).join("")}</div></div>`).join("")}</div>
      <p class="muted" style="margin:8px 0 0"><b>${esc(E.unseen_note)}</b> ${esc(E.per_1000_note)}</p>
      <p class="muted" style="margin:4px 0 0">${esc(E.versions_note)}${E.lab_link ? ` <a href="${esc(E.lab_link)}">${esc(E.lab_link_text)} →</a>` : ""}</p></div>`;
  }
  function forAgainst(C) {
    return `<div class="box"><h3>For and against today</h3>
      <div class="muted">For: rules this trade passed</div><ul class="ticks">${C.for.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      ${C.cautions.length ? `<div class="muted">Cautions</div><ul class="cautions">${C.cautions.map(c => `<li>${esc(c.text)}</li>`).join("")}</ul>` : `<div class="muted">No cautions fired today.</div>`}
      <p class="muted" style="margin:6px 0 0">${esc(C.closing)}</p></div>`;
  }
  function similarBox(C) {
    const M = C.similar;
    if (!M) return "";
    const table = g => g.rows.length ? `<div class="sim-group"><h4>${esc(g.title)}</h4><table><tr><th>Entry date</th><th>SOL then</th><th>30-day move then</th><th>Result per $1,000</th><th>How it exited</th></tr>
      ${g.rows.map(r => `<tr><td>${r.date}</td><td>${usd(r.sol)}</td><td>${r.move_30d_pct > 0 ? "+" : ""}${r.move_30d_pct.toFixed(1)}%</td><td class="${r.pnl_per_1000 >= 0 ? "pos" : "neg"}">${esc(r.result)}</td><td>${esc(r.exit)}</td></tr>`).join("")}</table></div>` : "";
    const groups = M.windows.map(table).join("");
    const DT = C.during_trade;
    return `<div class="box"><h3>Results on past days like today</h3><div class="muted">${esc(M.rule)}</div>
      <p style="margin:6px 0;font-weight:650">${esc(M.text)}</p>
      ${M.enough ? groups : (M.count ? `<details><summary>Show the ${M.count} day(s) anyway</summary>${groups}</details>` : "")}
      ${DT && DT.rows.length ? `<details><summary>${esc(DT.label)}</summary><div class="muted">${esc(DT.note)}</div><table><tr><th>Period</th><th>Verdict and SOL during the trade</th><th>Trades</th><th>Wins</th><th>Total per $1,000</th></tr>
        ${DT.rows.map(r => `<tr><td>${esc(r.window)}</td><td>${esc(r.group)}</td><td>${r.trades}</td><td>${r.wins}</td><td class="${r.total_per_1000 >= 0 ? "pos" : "neg"}">${esc(r.text)}</td></tr>`).join("")}</table></details>` : ""}</div>`;
  }
  function ideaCard(row, primary) {
    const S = row.suggestion, z = S.sizing, C = cardOf(row.id);
    const id = n => primary ? ` id="${n}"` : "";
    const left = `<div class="legs"><div><span class="act">Sell</span>${esc(S.short_leg.name)} <span class="muted">delta ${S.short_delta.toFixed(2)}</span></div>
      <div><span class="act">Buy</span>${esc(S.long_leg.name)}</div></div>
      <div class="kv">
        <div class="k">Expiry</div><div class="v">${S.expiry} (${Math.round(S.dte)} days)</div>
        <div class="k">Credit, conservative / mid</div><div class="v">${usd(S.credit_conservative)} / ${usd(S.credit_mid)} per SOL</div>
        <div class="k">Max loss</div><div class="v">${usd(S.max_loss)} per SOL</div>
        <div class="k">Break-even</div><div class="v">${usd(S.break_even)}</div>
        <div class="k">Approx. chance of profit</div><div class="v">${Math.round(S.prob_profit_approx * 100)}%</div>
        <div class="k">Size${D.config.risk.reference_sizing ? " (per $1,000 max loss)" : ""}</div><div class="v">${z.contracts} × ${S.contract_size} SOL</div>
        <div class="k">Total at risk / credit</div><div class="v">${usd(z.usd_at_risk)} / ${usd(z.credit_usd)}</div>
        <div class="k">Liquidity</div><div class="v">OI ≥ ${Math.round(S.liquidity.min_oi)} · spread ≤ ${Math.round(S.liquidity.worst_spread_pct)}%</div>
      </div>
      ${z.note ? `<div class="banner warn" style="margin-top:10px">${esc(z.note)}</div>` : ""}
      ${D.config.risk.reference_sizing ? `<div class="muted" style="margin-top:6px">Reference sizing: every size and dollar figure assumes a $1,000 max loss per trade (up to $3,000 across open spreads). Scale to your own size: risking $2,500 means 2.5× the contracts and dollars shown.</div>` : ""}
      ${primary ? `<details class="tryl"><summary>Try different loss limits</summary>
        <div class="tl-grid">
          <label>Max loss per trade ($)<input id="tl-per" type="number" min="0" step="10" value="${D.config.risk.max_loss_per_trade_usd}"></label>
          <label>Max loss, all spreads ($)<input id="tl-tot" type="number" min="0" step="10" value="${D.config.risk.max_total_spread_risk_usd}"></label>
          <label>Already open ($)<input id="tl-open" type="number" min="0" step="10" value="${D.config.risk.current_open_risk_usd}"></label>
        </div>
        <div id="tl-out" class="tl-out"></div>
        <div class="muted">Preview only. To keep new limits, double-click <b>set_limits.bat</b> on the laptop, then rescan.</div>
      </details>
      <div class="chart"${id("payoff")} style="margin-top:10px"></div>
      <div class="muted">Payoff at expiry per SOL. Settles in USDC — to own more SOL, buy spot separately.</div>` : ""}
      ${primary && L.alternates && L.alternates.length ? `<details><summary>${L.alternates.length} alternate(s)</summary><table><tr><th>Expiry</th><th>Strikes</th><th>Credit</th><th>Max loss</th></tr>
        ${L.alternates.map(a => `<tr><td>${a.expiry}</td><td>${a.short_leg.strike}/${a.long_leg.strike}</td><td>${usd(a.credit_conservative)}</td><td>${usd(a.max_loss)}</td></tr>`).join("")}</table></details>` : ""}
      ${whyBlock(S)}`;
    const right = C ? evidenceBox(C) + forAgainst(C) + similarBox(C) : "";
    return `<section class="card a-idea" id="idea-${esc(row.id)}"><h2><span class="step">2</span>Today's idea: ${esc(row.name.toLowerCase())}</h2>
      <div class="idea-cols"><div class="idea-left">${left}</div><div class="idea-right">${right}</div></div></section>`;
  }
  const rows = (L.strategies || []).filter(r => r.status === "suggested" && r.suggestion);
  const ideaRows = rows.length ? rows : (S ? [{id: "bull_put_spread", name: "Bull put spread", suggestion: S}] : []);
  ideaRows.forEach((r, i) => { html += ideaCard(r, i === 0); });
  if (!ideaRows.length) {
    const W = L.why_no_trade || {market:[L.no_trade_reason], goals:[]};
    html += `<section class="card a-idea"><h2><span class="step">2</span>Today's idea</h2><div class="no-trade">No trade today</div>
      <div class="why" style="border-top:0;margin-top:4px;padding-top:0">
        <div class="conv None"><div class="conv-top"><span class="lbl">Conviction: none</span><span class="sc">no trade</span></div>
          <div class="conv-act">Sitting out is the right call today. Nothing passed the rules.</div></div>
        <h3>Market conditions</h3><ul>${W.market.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
        ${W.goals.length ? `<h3>How this fits your plan</h3><ul>${W.goals.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
      </div></section>`;
  }

  // ---- verdict
  const metric = V.mode === "percentile"
    ? `<div class="stat"><div class="k">IV percentile</div><div class="v">${Math.round(V.percentile)}</div></div>`
    : `<div class="stat"><div class="k">IV / RV30 (bootstrap)</div><div class="v">${V.iv_rv_ratio ? V.iv_rv_ratio.toFixed(2) + "×" : "n/a"}</div></div>`;
  let lower = `<section class="card a-verdict"><h2><span class="step">5</span>Is volatility rich or cheap?</h2>
    <div class="vbody"><div class="verdict"><span class="badge ${V.label}">${V.label}</span>
      <div class="muted">${V.mode === "percentile" ? `vs ${V.history_days} days of IV history` : `${V.history_days || 0} of ${D.config?.vol?.min_history_days ?? 60} days of IV history collected — using IV vs realised vol until then`}</div></div>
    <div class="stats">
      <div class="stat"><div class="k">ATM implied vol (30-day)</div><div class="v">${pct(V.atm_iv)}</div></div>
      ${metric}
      <div class="stat"><div class="k">Realised vol, 20 days</div><div class="v">${pct(V.rv20)}</div></div>
      <div class="stat"><div class="k">Realised vol, 30 days</div><div class="v">${pct(V.rv30)}</div></div>
    </div></div>
    <div class="reason">${esc(V.reason)}</div></section>`;
  html += `<div class="grid${S ? "" : " no-greeks"}">` + lower;

  // ---- charts
  html += `<section class="card a-hist"><h2><span class="step">6</span>Implied vs realised volatility</h2>
    <div class="controls"><div class="seg" id="rng">${["1M","3M","6M","1Y","All"].map((r,i)=>`<button data-d="${[30,91,182,365,1000][i]}" class="${r==="3M"?"on":""}">${r}</button>`).join("")}</div>
      <div class="seg"><button id="pricebtn" aria-pressed="false">SOL price</button></div></div>
    <div class="legend"><span><i style="background:var(--series-iv)"></i>Implied vol (30-day ATM)</span><span><i style="background:var(--series-rv)"></i>Realised vol (30-day)</span><span id="pricelegend" hidden><i style="background:var(--series-price)"></i>SOL price (lower panel)</span>
      <span><i class="band" style="background:var(--rich-band);outline:1px solid var(--rich)"></i>IV was rich</span><span><i class="band" style="background:var(--cheap-band);outline:1px solid var(--cheap)"></i>IV was cheap</span></div>
    <div class="chart" id="hist"></div>
    <div class="muted" id="histnote"></div></section>`;
  html += `<section class="card a-term"><h2><span class="step">7</span>Term structure (IV by expiry)</h2>
    <div class="legend"><span><i style="background:var(--series-iv)"></i>Today</span>${L.term_structure_last_week ? `<span><i style="background:var(--series-faded)"></i>${L.term_structure_last_week.date}</span>` : ""}</div>
    <div class="chart" id="term"></div>
    <div class="muted">Normally longer expiries cost more. If the short end sits above the long end, the market is stressed.</div></section>`;

  // ---- exit plan and Greeks for today's idea (below the idea card)
  if (S) {
    const E = S.exit_plan;
    if (E) html += `<section class="card a-exit"><h2><span class="step">3</span>Exit plan: set these the moment you enter</h2>
      <div class="exit-sum">
        <div class="stat"><div class="k">Loss if the stop fires</div><div class="v">≈ ${usd(E.loss_at_stop_usd, 0)}</div><div class="muted">instead of ${usd(E.max_loss_usd, 0)} maximum</div></div>
        <div class="stat"><div class="k">Win rate needed to break even</div><div class="v">${Math.round(E.breakeven_win_rate * 100)}%</div><div class="muted">this trade's rough chance of profit: ${Math.round(E.prob_profit_approx * 100)}%</div></div>
      </div>
      ${E.illustrative_one_contract ? `<div class="muted">Order sizes shown for 1 contract (your limits currently allow 0).</div>` : ""}
      <div class="esteps">${E.steps.map(st => `<div class="estep ${st.key}"><div class="eh">${esc(st.title)}</div>
        <div class="el">${esc(st.level)}</div><p>${esc(st.result)}</p><p class="s">${esc(st.why)}</p>
        <div class="ticket"><span>Order</span>${esc(st.ticket)}</div></div>`).join("")}</div>
      <p class="after"><b>If a stop fires:</b> ${esc(E.after_stop)}</p>
      <div class="muted">${esc(E.order_note)} Settings: take profit ${E.settings.take_profit_pct}%${E.settings.split_take_profit ? " on half" : ""} · stop ${E.settings.stop_multiple}× credit · IV +${E.settings.iv_points_per_pct_drop} pt per 1% drop · close ${E.settings.time_exit_dte} days before expiry (change in strategies/bull_put_spread.toml, [exits]). Levels are model estimates.</div>
    </section>`;
    const P = S.greeks_panel;
    html += `<section class="card a-greeks"><h2><span class="step">4</span>The Greeks, in plain language</h2><div class="muted" style="margin-bottom:8px">${esc(P.size_note)}</div>
      <div class="gitems">${P.items.map(g => `<div class="greek"><div class="h"><span>${g.greek}</span><span>${(g.greek === "Gamma" ? g.value.toFixed(4) : usd(g.value))} ${esc(g.unit)}</span></div>
        <p>${esc(g.now)}</p><p class="s"><b>When it shifts:</b> ${esc(g.shift)}</p></div>`).join("")}</div>
      <div class="greek gsum"><p><b>Hurts most:</b> ${esc(P.summary.hurts_most)}</p><p><b>Helps most:</b> ${esc(P.summary.helps_most)}</p></div>
      <h2 style="margin-top:12px">What if… (approximate)</h2>
      <table><tr><th>SOL tomorrow</th>${P.what_if.price_tomorrow.map(r => `<th>${r.move_pct > 0 ? "+" : ""}${r.move_pct}%</th>`).join("")}</tr>
        <tr><td>P&amp;L</td>${P.what_if.price_tomorrow.map(r => `<td class="${r.pnl_usd >= 0 ? "pos" : "neg"}">${usd(r.pnl_usd, 0)}</td>`).join("")}</tr></table>
      <table style="margin-top:6px"><tr><th>IV today</th>${P.what_if.iv_today.map(r => `<th>${r.iv_points > 0 ? "+" : ""}${r.iv_points} pts</th>`).join("")}</tr>
        <tr><td>P&amp;L</td>${P.what_if.iv_today.map(r => `<td class="${r.pnl_usd >= 0 ? "pos" : "neg"}">${usd(r.pnl_usd, 0)}</td>`).join("")}</tr></table>
      <div class="muted" style="margin-top:6px">${esc(P.what_if.label)}</div></section>`;
  }

  // ---- log
  const log = (D.log || []).filter(r => r.trade === "yes").slice(0, 20);
  html += `<section class="card a-log"><h2><span class="step">8</span>Track record</h2>
    ${(() => { const pr = D.premium || {trades:0};
      return pr.trades ? `<div class="exit-sum" style="margin-bottom:10px"><div class="stat"><div class="k">SOL bought with premium</div><div class="v">${pr.sol_bought.toFixed(3)} SOL</div></div>
        <div class="stat"><div class="k">Premium collected</div><div class="v">${usd(pr.credit_usd)}</div><div class="muted">from ${pr.trades} trade(s)</div></div></div>`
      : `<div class="muted" style="margin-bottom:10px">To track SOL bought with premium, add each trade you take to <b>my_premium_log.csv</b> (opens in Excel): date, spread, credit_usd, and the SOL price you bought at.</div>`; })()}
    <h3 class="sub">Past suggestions</h3>${log.length ? `<table><tr><th>Date</th><th>Spread</th><th>Credit</th><th>Outcome</th></tr>
    ${log.map(r => `<tr><td>${r.date}</td><td>${r.expiry?.slice(5)} ${(+r.short_strike)}/${(+r.long_strike)}</td><td>${usd(+r.credit_conservative)}</td>
      <td>${r.outcome ? `${esc(r.outcome)}${r.pnl_per_sol ? ` <span class="${+r.pnl_per_sol >= 0 ? "pos" : "neg"}">${usd(+r.pnl_per_sol)}</span>` : ""}` : `<span class="muted">open</span>`}</td></tr>`).join("")}</table>`
    : `<div class="muted">No trade suggestions yet.</div>`}</section>`;
  html += `</div><footer>${L.strategy ? `Rules: ${esc(L.strategy.title)} · version ${esc(L.strategy.version)} · fingerprint ${esc(L.strategy.fingerprint)}. ` : ""}Snapshot from the last daily run, not live prices. Check live quotes on Deribit before trading. Suggestions only, not financial advice. This tool cannot place orders.</footer>`;
  app.innerHTML = html;

  // ================= charts (plain SVG) =================
  const {css, el, niceTicks, frame, axes, path, hover} = window.Charts;   // shared with lab.html (charts.js)

  const byDate = {}; D.history.forEach(r => byDate[r.date] = r);
  const addDays = (d, n) => new Date(new Date(d + "T00:00:00Z").getTime() + n * 864e5).toISOString().slice(0, 10);
  const signed = v => (v >= 0 ? "+" : "") + (v * 100).toFixed(1) + "%";
  function aftermath(r) {
    // What happened over the following 30 days: price move and realised vol vs the IV priced on this day.
    const later = byDate[addDays(r.date, 30)];
    if (!later) return `<span class="muted">Next 30 days: not known yet</span>`;
    const move = r.index_price && later.index_price ? later.index_price / r.index_price - 1 : null;
    let out = `Next 30 days: SOL ${move == null ? "n/a" : signed(move)}`;
    if (later.rv30 != null && r.atm_iv_30d != null) {
      out += `, realised ${pct(later.rv30)} vs implied ${pct(r.atm_iv_30d)}<br><span class="muted">`
        + (later.rv30 < r.atm_iv_30d ? "Moves were smaller than priced: option sellers were paid" : "Moves were bigger than priced: option buyers were paid") + `</span>`;
    }
    return out;
  }

  let showPrice = false; try { showPrice = localStorage.getItem("solvol.showPrice") === "1"; } catch (e) {}
  function drawHistory(days) {
    const host = document.getElementById("hist");
    const w = host.clientWidth || 520, base = Math.round(Math.min(Math.max(w * (w > 700 ? 0.5 : 0.42), 210), w > 700 ? 430 : 340));
    const H = showPrice ? base + 160 : base, f = frame(host, H);
    const gap = 22, h1 = showPrice ? base - 50 : f.ih, top2 = f.m.t + h1 + gap, h2 = showPrice ? f.ih - h1 - gap : 0;
    const end = new Date(D.history.length ? D.history[D.history.length - 1].date : Date.now());
    const start = new Date(end - days * 864e5);
    const rows = D.history.filter(r => new Date(r.date) >= start && (r.atm_iv_30d != null || r.rv30 != null || r.index_price != null));
    if (!rows.length) { host.innerHTML = `<p class="muted">No history yet.</p>`; return; }
    const t = r => new Date(r.date).getTime();
    const t0 = t(rows[0]), t1 = Math.max(t(rows[rows.length - 1]), t0 + 864e5);
    const vals = rows.flatMap(r => [r.atm_iv_30d, r.rv30]).filter(v => v != null);
    const lo = Math.max(0, Math.min(...vals) * 0.9), hi = Math.max(...vals) * 1.08;
    const x = v => f.m.l + (v - t0) / (t1 - t0) * f.iw, y = v => f.m.t + h1 - (v - lo) / (hi - lo) * h1;
    const dayW = f.iw / Math.max(1, (t1 - t0) / 864e5);
    // Shade runs of consecutive RICH / CHEAP days (across both panels), at least 8px wide so a lone day is visible.
    const clipId = "clip" + Math.random().toString(36).slice(2);
    el("rect", {x:f.m.l, y:f.m.t, width:f.iw, height:f.ih}, el("clipPath", {id:clipId}, el("defs", {}, f.svg)));
    const bands = el("g", {"clip-path":`url(#${clipId})`}, f.svg);
    const runs = []; let run = null;
    rows.forEach((r, i) => {
      const v = (r.verdict === "RICH" || r.verdict === "CHEAP") ? r.verdict : null;
      if (v && run && run.v === v && run.end === i - 1) { run.end = i; return; }
      if (run) runs.push(run);
      run = v ? {v, start:i, end:i} : null;
    });
    if (run) runs.push(run);
    const right = f.m.l + f.iw;
    runs.forEach(u => {
      let a = x(t(rows[u.start])) - dayW / 2, b = x(t(rows[u.end])) + dayW / 2;
      if (b - a < 8) { const c = (a + b) / 2; a = c - 4; b = c + 4; }
      if (b > right) { a -= b - right; b = right; }
      if (a < f.m.l) { b += f.m.l - a; a = f.m.l; }
      const fill = css(u.v === "RICH" ? "--rich-band" : "--cheap-band");
      el("rect", {x:a, y:f.m.t, width:b - a, height:h1, fill}, bands);
      if (showPrice) el("rect", {x:a, y:top2, width:b - a, height:h2, fill}, bands);
    });
    if (rows.filter(r => r.atm_iv_30d != null).length < 10) {
      const note = el("text", {x:f.m.l + 8, y:f.m.t + 14, "font-size":11, fill:css("--text-muted")}, f.svg);
      note.textContent = "Shading fills in as daily IV history builds up";
    }
    const xt = []; for (let i = 0; i <= 3; i++) xt.push(t0 + (t1 - t0) * i / 3);
    axes(f, x, y, niceTicks(lo, hi), v => Math.round(v * 100) + "%", xt, v => new Date(v).toLocaleDateString("en-SG", {day:"numeric", month:"short"}));
    el("path", {d:path(rows.map(r => r.rv30 == null ? null : [x(t(r)), y(r.rv30)])), fill:"none", stroke:css("--series-rv"), "stroke-width":2, "stroke-linejoin":"round"}, f.svg);
    el("path", {d:path(rows.map(r => r.atm_iv_30d == null ? null : [x(t(r)), y(r.atm_iv_30d)])), fill:"none", stroke:css("--series-iv"), "stroke-width":2, "stroke-linejoin":"round"}, f.svg);
    const lastIv = [...rows].reverse().find(r => r.atm_iv_30d != null);
    if (lastIv) el("circle", {cx:x(t(lastIv)), cy:y(lastIv.atm_iv_30d), r:4, fill:css("--series-iv"), stroke:css("--surface-1"), "stroke-width":2}, f.svg);

    if (showPrice) {   // second panel with its own axis (never a dual-axis chart)
      const pv = rows.map(r => r.index_price).filter(v => v != null);
      const plo = Math.min(...pv) * 0.97, phi = Math.max(...pv) * 1.03;
      const py = v => top2 + h2 - (v - plo) / (phi - plo) * h2;
      const lab = el("text", {x:f.m.l, y:top2 - 6, "font-size":11, fill:css("--text-secondary")}, f.svg); lab.textContent = "SOL price (USD)";
      niceTicks(plo, phi, 3).forEach(v => {
        el("line", {x1:f.m.l, x2:f.W - f.m.r, y1:py(v), y2:py(v), stroke:css("--grid"), "stroke-width":1}, f.svg);
        const tx = el("text", {x:f.m.l - 6, y:py(v) + 4, "text-anchor":"end", "font-size":11, fill:css("--text-muted")}, f.svg); tx.textContent = "$" + v;
      });
      el("path", {d:path(rows.map(r => r.index_price == null ? null : [x(t(r)), py(r.index_price)])), fill:"none", stroke:css("--series-price"), "stroke-width":2, "stroke-linejoin":"round"}, f.svg);
    }
    hover(f, rows.map(r => x(t(r))), i => { const r = rows[i];
      const src = r.iv_source === "trades_backfill" ? " (backfill)" : r.iv_source === "imported" ? " (imported)" : r.iv_source === "dvol_scaled" ? " (from DVOL)" : "";
      return `<b>${r.date}</b> · SOL ${r.index_price != null ? usd(r.index_price) : "n/a"}<br>IV ${pct(r.atm_iv_30d)}${src} · RV30 ${pct(r.rv30)}${r.verdict ? ` · <b>${r.verdict}</b>` : ""}<br>${aftermath(r)}`; });
    const nIv = D.history.filter(r => r.atm_iv_30d != null).length, nBf = D.history.filter(r => r.iv_source === "trades_backfill").length;
    const nDv = D.history.filter(r => r.iv_source === "dvol_scaled").length, dvc = (L.checks || {}).dvol || {};
    document.getElementById("histnote").textContent = `${nIv} day(s) of implied vol recorded${nBf ? `, ${nBf} approximated from past trades` : ""}${nDv ? `, ${nDv} from Deribit's SOL volatility index (DVOL, scaled ×${(dvc.ratio || 1).toFixed(2)} to match at-the-money IV)` : ""}. Realised vol comes from daily SOL prices. Hover a day to see what happened over the next 30 days.`
      + (dvc.available === false && dvc.error && dvc.error !== "not fetched" ? ` SOL DVOL: not available (${dvc.error}).` : "")
      + (nIv < 30 && !nBf ? " Only days with implied vol can be shaded rich or cheap. To fill in the past 90 days, run: run_scan.bat --backfill" : "");
  }

  function drawTerm(Hfix) {
    const host = document.getElementById("term"), f = frame(host, Hfix || Math.round(Math.min(Math.max((host.clientWidth || 520) * 0.5, 180), 240)));
    const today = L.term_structure.filter(r => r.dte >= 1), wk = L.term_structure_last_week ? L.term_structure_last_week.rows.filter(r => r.dte >= 1) : [];
    if (!today.length) { host.innerHTML = `<p class="muted">No term structure.</p>`; return; }
    const ds = today.concat(wk).map(r => r.dte), vs = today.concat(wk).map(r => r.atm_iv);
    const x0 = 0, x1 = Math.max(...ds) * 1.03, lo = Math.min(...vs) * 0.92, hi = Math.max(...vs) * 1.06;
    const x = v => f.m.l + (v - x0) / (x1 - x0) * f.iw, y = v => f.m.t + f.ih - (v - lo) / (hi - lo) * f.ih;
    axes(f, x, y, niceTicks(lo, hi), v => Math.round(v * 100) + "%", niceTicks(0, x1, 4), v => v + "d");
    if (wk.length) el("path", {d:path(wk.map(r => [x(r.dte), y(r.atm_iv)])), fill:"none", stroke:css("--series-faded"), "stroke-width":2}, f.svg);
    el("path", {d:path(today.map(r => [x(r.dte), y(r.atm_iv)])), fill:"none", stroke:css("--series-iv"), "stroke-width":2}, f.svg);
    today.forEach(r => el("circle", {cx:x(r.dte), cy:y(r.atm_iv), r:4, fill:css("--series-iv"), stroke:css("--surface-1"), "stroke-width":2}, f.svg));
    hover(f, today.map(r => x(r.dte)), i => `<b>${today[i].expiry}</b> (${Math.round(today[i].dte)}d)<br>ATM IV ${pct(today[i].atm_iv)}`);
  }

  function drawPayoff() {
    if (!S) return;
    const host = document.getElementById("payoff"), f = frame(host, Math.round(Math.min(Math.max((host.clientWidth || 520) * 0.42, 160), 220)));
    const ks = S.short_leg.strike, kl = S.long_leg.strike, cr = S.credit_conservative, spot = L.index_price;
    const lo = Math.min(kl * 0.85, spot * 0.8), hi = Math.max(ks * 1.12, spot * 1.12);
    const pnl = s => cr - (Math.max(0, ks - s) - Math.max(0, kl - s));
    const xs = []; for (let i = 0; i <= 120; i++) xs.push(lo + (hi - lo) * i / 120);
    const ymin = -S.max_loss * 1.15, ymax = cr * 1.6;
    const x = v => f.m.l + (v - lo) / (hi - lo) * f.iw, y = v => f.m.t + f.ih - (v - ymin) / (ymax - ymin) * f.ih;
    axes(f, x, y, niceTicks(ymin, ymax, 4), v => (v < 0 ? "-$" : "$") + Math.abs(v), niceTicks(lo, hi, 4), v => "$" + v);
    el("line", {x1:f.m.l, x2:f.W - f.m.r, y1:y(0), y2:y(0), stroke:css("--text-muted"), "stroke-width":1}, f.svg);
    el("line", {x1:x(spot), x2:x(spot), y1:f.m.t, y2:f.m.t + f.ih, stroke:css("--text-muted"), "stroke-dasharray":"3 3"}, f.svg);
    const st = el("text", {x:x(spot) + 4, y:f.m.t + f.ih - 6, "font-size":11, fill:css("--text-secondary")}, f.svg); st.textContent = "SOL now";
    el("path", {d:path(xs.map(s => [x(s), y(pnl(s))])), fill:"none", stroke:css("--series-iv"), "stroke-width":2}, f.svg);
    if (S.exit_plan && S.exit_plan.price_stop_spot > lo) {
      const xs0 = x(S.exit_plan.price_stop_spot);
      el("line", {x1:xs0, x2:xs0, y1:f.m.t, y2:f.m.t + f.ih, stroke:css("--rich"), "stroke-dasharray":"4 3"}, f.svg);
      const tt = el("text", {x:xs0 - 4, y:f.m.t + 12, "text-anchor":"end", "font-size":11, fill:css("--rich")}, f.svg); tt.textContent = "stop";
    }
    const be = el("text", {x:x(S.break_even) + 6, y:y(0) + 14, "text-anchor":"start", "font-size":11, fill:css("--text-secondary")}, f.svg); be.textContent = "BE " + S.break_even.toFixed(2);
    hover(f, xs.map(x), i => `SOL at expiry <b>${usd(xs[i])}</b><br>P&L ${usd(pnl(xs[i]))} per SOL`);
  }

  let days = 91;
  const pb = document.getElementById("pricebtn"), pl = document.getElementById("pricelegend");
  const syncPrice = () => { pb.classList.toggle("on", showPrice); pb.setAttribute("aria-pressed", showPrice); pl.hidden = !showPrice; };
  function layoutCharts() {
    drawHistory(days); drawTerm(); drawPayoff();
    // Desktop: term structure sits beside the history chart, so stretch it to the same height (price panel on or off)
    // Tablet: term structure sits beside the verdict instead, so match that card.
    if (window.innerWidth >= 700) {
      const hc = document.querySelector(window.innerWidth >= 1100 ? ".a-hist" : ".a-verdict"), tc = document.querySelector(".a-term"), th = document.getElementById("term");
      tc.style.alignSelf = "start";
      const extra = tc.offsetHeight - th.offsetHeight, target = hc.offsetHeight - extra;
      tc.style.alignSelf = "";
      if (target > 150) drawTerm(Math.min(target, 700));
    }
  }
  syncPrice(); layoutCharts();
  if (S) {   // "try different loss limits" preview
    const per = document.getElementById("tl-per"), tot = document.getElementById("tl-tot"), opn = document.getElementById("tl-open"), out = document.getElementById("tl-out");
    const calc = () => {
      const pc = S.sizing.max_loss_per_contract_usd, budget = Math.min(+per.value || 0, Math.max(0, (+tot.value || 0) - (+opn.value || 0)));
      const n = pc > 0 ? Math.floor(budget / pc) : 0, sol = n * S.contract_size, credit = n * S.credit_conservative * S.contract_size;
      out.innerHTML = n ? `<b>${n} contract(s)</b> (${sol} SOL): ${usd(n * pc)} at risk, ${usd(credit)} credit ≈ ${(credit / L.index_price).toFixed(3)} SOL at today's price.`
        + (S.exit_plan ? ` With the stop: ≈ ${usd(S.exit_plan.loss_at_stop_usd / (S.sizing.contracts || 1) * n, 0)} if it fires.` : "")
        : `0 contracts: one contract risks ${usd(pc)}, but the budget is ${usd(budget)}.`;
    };
    [per, tot, opn].forEach(i => i && i.addEventListener("input", calc)); if (per) calc();
  }
  // Redraw charts when the window or a rotated tablet changes size
  let lastW = app.clientWidth, rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => {
    if (app.clientWidth === lastW) return; lastW = app.clientWidth; layoutCharts(); }, 150); });
  pb.onclick = () => { showPrice = !showPrice; try { localStorage.setItem("solvol.showPrice", showPrice ? "1" : "0"); } catch (e) {} syncPrice(); layoutCharts(); };
  document.querySelectorAll("#rng button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#rng button").forEach(o => o.classList.toggle("on", o === b)); days = +b.dataset.d; layoutCharts(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => location.reload());
})();
</script>
</body>
</html>
