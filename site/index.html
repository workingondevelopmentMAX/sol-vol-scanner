<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOL Vol Scanner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a19">
<style>
:root {
  color-scheme: light;
  --surface-0:#f4f3f0; --surface-1:#fcfcfb; --border:#e3e1dc;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7a7974;
  --grid:#e9e7e2;
  --series-iv:#2a78d6; --series-rv:#eb6834; --series-faded:#a8a7a1; --series-price:#52514e;
  --rich:#d03b3b; --rich-band:rgba(208,59,59,.10);
  --cheap:#0b7d0b; --cheap-band:rgba(12,163,12,.10);
  --fair:#7a7974; --good:#0b7d0b; --bad:#c42f2f;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface-0:#111110; --surface-1:#1a1a19; --border:#2e2e2b;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8f8e86;
    --grid:#2a2a27;
    --series-iv:#3987e5; --series-rv:#d95926; --series-faded:#5c5b56; --series-price:#c3c2b7;
    --rich:#e66767; --rich-band:rgba(230,103,103,.14);
    --cheap:#0ca30c; --cheap-band:rgba(12,163,12,.14);
    --fair:#8f8e86; --good:#3fbf3f; --bad:#e66767;
  }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--surface-0); color:var(--text-primary);
  font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
main { max-width:none; margin:0 auto; padding:12px 12px 40px; }
.grid { display:grid; gap:12px; grid-template-columns:minmax(0,1fr);
  grid-template-areas:"verdict" "hist" "term" "idea" "exit" "greeks" "log"; }
.grid > .card { margin:0; min-width:0; }
.a-idea, .a-greeks, .a-log, .a-exit { align-self:start; }
.a-verdict { grid-area:verdict; } .a-hist { grid-area:hist; } .a-term { grid-area:term; }
.a-idea { grid-area:idea; } .a-greeks { grid-area:greeks; } .a-log { grid-area:log; }
.step { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%;
  background:var(--text-primary); color:var(--surface-1); font-size:11px; font-weight:700; margin-right:8px; letter-spacing:0; vertical-align:1px; }
.gitems .greek:first-child { border-top:0; padding-top:0; }
/* iPad / tablet: same top-down order, wider cards */
@media (min-width:700px) {
  main { padding:20px 20px 48px; }
  .grid { grid-template-columns:repeat(2, minmax(0,1fr));
    grid-template-areas:"verdict term" "hist hist" "idea exit" "greeks greeks" "log log"; }
  .grid.no-greeks { grid-template-areas:"verdict term" "hist hist" "idea log"; }
  header h1 { font-size:20px; }
}
/* desktop: 1 market read -> 2-3 context -> 4-5 the idea and its risk -> 6 track record */
@media (min-width:1100px) {
  main { padding:24px 28px 56px; }
  .grid { grid-template-columns:repeat(3, minmax(0,1fr));
    grid-template-areas:"verdict verdict verdict" "hist hist term" "idea exit exit" "idea greeks greeks" "log log log"; }
  .grid .esteps { grid-template-columns:repeat(2, minmax(0,1fr)); }
  .grid.no-greeks { grid-template-areas:"verdict verdict verdict" "hist hist term" "idea log log"; }
  .grid .stats { grid-template-columns:repeat(4, minmax(0,1fr)); }
  .gitems { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); column-gap:24px; }
  .gitems .greek:nth-child(2) { border-top:0; padding-top:0; }
  .vbody { display:grid; grid-template-columns:auto minmax(0,1fr); gap:28px; align-items:center; }
  .vbody .stats { margin-top:0; }
  .verdict { flex-direction:column; align-items:flex-start; gap:8px; max-width:260px; }
  .a-greeks table { max-width:720px; }
  .a-log table { max-width:900px; }
}
@media (max-width:380px) { .badge { font-size:24px; } .stat .v { font-size:18px; } }
header { display:flex; justify-content:space-between; align-items:baseline; padding:6px 4px 10px; }
header h1 { font-size:17px; margin:0; letter-spacing:.2px; }
header .upd { font-size:12px; color:var(--text-muted); text-align:right; }
.banner { border-radius:10px; padding:10px 12px; margin:0 0 10px; font-size:13px; border:1px solid; }
.banner.warn { border-color:var(--rich); color:var(--text-primary); background:var(--rich-band); }
.banner.info { border-color:var(--border); color:var(--text-secondary); background:var(--surface-1); }
.card { background:var(--surface-1); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px; }
.card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-secondary); margin:0 0 10px; font-weight:600; }
.verdict { display:flex; align-items:center; gap:14px; }
.badge { font-size:30px; font-weight:800; letter-spacing:1px; padding:6px 14px; border-radius:12px; border:2px solid currentColor; }
.badge.RICH { color:var(--rich); } .badge.CHEAP { color:var(--cheap); } .badge.FAIR, .badge.UNKNOWN { color:var(--fair); }
.reason { font-size:13px; color:var(--text-secondary); margin-top:10px; }
.stats { display:grid; grid-template-columns:repeat(2,1fr); gap:10px 14px; margin-top:12px; }
.stat .k { font-size:12px; color:var(--text-muted); } .stat .v { font-size:20px; font-weight:650; font-variant-numeric:tabular-nums; }
.controls { display:flex; gap:8px; flex-wrap:wrap; }
.seg { display:inline-flex; border:1px solid var(--border); border-radius:9px; overflow:hidden; margin-bottom:8px; }
.seg button { background:none; border:0; color:var(--text-secondary); padding:6px 12px; font:inherit; font-size:13px; }
.seg button.on { background:var(--text-primary); color:var(--surface-1); }
.legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--text-secondary); margin:4px 0 2px; }
.legend i { display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:5px; }
.legend i.band { height:10px; width:12px; border-radius:2px; }
.chart { position:relative; }
.chart svg { display:block; width:100%; height:auto; touch-action:pan-y; }
.tip { position:absolute; pointer-events:none; background:var(--surface-1); border:1px solid var(--border);
  border-radius:8px; padding:6px 8px; font-size:12px; box-shadow:0 2px 8px rgba(0,0,0,.15); display:none; white-space:nowrap; max-width:100%; }
.tip .muted { font-size:11px; }
.tip b { font-weight:650; }
.kv { display:grid; grid-template-columns:1fr auto; gap:6px 10px; font-size:14px; }
.kv .k { color:var(--text-secondary); } .kv .v { text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
.legs { font-size:14px; margin-bottom:10px; }
.legs div { padding:3px 0; } .legs .act { display:inline-block; width:38px; font-weight:700; }
.muted { color:var(--text-muted); font-size:12px; }
.greek { border-top:1px solid var(--border); padding:10px 0; }
.greek:first-of-type { border-top:0; padding-top:0; }
.greek .h { display:flex; justify-content:space-between; font-weight:650; }
.greek .h span:last-child { font-variant-numeric:tabular-nums; color:var(--text-secondary); font-weight:500; font-size:13px; }
.greek p { margin:4px 0 0; font-size:13.5px; } .greek p.s { color:var(--text-secondary); }
table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
th, td { padding:6px 4px; text-align:right; border-bottom:1px solid var(--border); }
th:first-child, td:first-child { text-align:left; }
th { color:var(--text-muted); font-weight:500; font-size:12px; }
.pos { color:var(--good); } .neg { color:var(--bad); }
details summary { cursor:pointer; color:var(--text-secondary); font-size:13px; margin-top:8px; }
.why { margin-top:14px; border-top:1px solid var(--border); padding-top:12px; }
.why h3 { font-size:13px; margin:14px 0 6px; color:var(--text-primary); }
.why ul { margin:0; padding-left:18px; font-size:13.5px; } .why li { margin:4px 0; }
.conv { border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
.conv-top { display:flex; justify-content:space-between; align-items:baseline; font-weight:700; }
.conv-top .sc { font-variant-numeric:tabular-nums; color:var(--text-secondary); font-weight:600; }
.conv.High { border-color:var(--good); } .conv.High .lbl { color:var(--good); }
.conv.Medium { border-color:#c98500; } .conv.Medium .lbl { color:#b07400; }
.conv.Low .lbl, .conv.None .lbl { color:var(--text-secondary); }
@media (prefers-color-scheme: dark) { .conv.Medium .lbl { color:#eda100; } }
.meter { position:relative; height:8px; border-radius:4px; background:var(--grid); margin:8px 0 6px; overflow:hidden; }
.meter b { position:absolute; left:0; top:0; bottom:0; border-radius:4px; background:var(--text-secondary); }
.conv.High .meter b { background:var(--good); } .conv.Medium .meter b { background:#c98500; }
.meter i { position:absolute; top:0; bottom:0; width:2px; background:var(--surface-1); }
.conv-act { font-size:13.5px; } .conv .muted { margin-top:4px; }
.parts { width:100%; margin-top:6px; } .parts td { text-align:left; vertical-align:top; font-size:12.5px; }
.parts td.pt { text-align:right; white-space:nowrap; color:var(--text-secondary); }
.a-exit { grid-area:exit; }
.exit-sum { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px 16px; margin-bottom:6px; }
.esteps { display:grid; gap:10px; margin-top:10px; grid-template-columns:minmax(0,1fr); }
.estep { border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
.estep .eh { font-weight:700; font-size:14px; }
.estep .el { font-weight:600; font-variant-numeric:tabular-nums; margin-top:2px; }
.estep p { margin:4px 0 0; font-size:13px; } .estep p.s { color:var(--text-secondary); }
.estep.price_stop, .estep.vol_stop { border-left:3px solid var(--rich); }
.estep.take_profit { border-left:3px solid var(--good); }
.ticket { margin-top:8px; font:12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background:var(--surface-0);
  border-radius:8px; padding:7px 9px; color:var(--text-primary); overflow-wrap:anywhere; }
.ticket span { display:block; font:600 10px/1.4 -apple-system, "Segoe UI", sans-serif; letter-spacing:.6px; text-transform:uppercase; color:var(--text-muted); }
.after { font-size:13.5px; margin:12px 0 6px; }
h3.sub { font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); margin:6px 0 4px; font-weight:600; }
.tryl summary { margin-top:10px; }
.tl-grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin:8px 0; }
.tl-grid label { font-size:12px; color:var(--text-secondary); display:flex; flex-direction:column; gap:4px; }
.tl-grid input { font:inherit; font-size:14px; padding:6px 8px; border:1px solid var(--border); border-radius:8px; background:var(--surface-0); color:var(--text-primary); width:100%; }
.tl-out { font-size:13.5px; margin-bottom:6px; }
footer { font-size:12px; color:var(--text-muted); padding:4px 6px; }
.no-trade { font-size:16px; font-weight:650; margin-bottom:6px; }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script src="data/data.js"></script>
<script>
(async function () {
  let D = window.SCANNER_DATA;
  if (!D) { try { D = await (await fetch("data/latest.json", {cache:"no-store"})).json(); } catch (e) {} }
  const app = document.getElementById("app");
  if (!D || !D.latest) {
    app.innerHTML = `<div class="card"><h2>No data yet</h2><p>Run <b>run_scan.bat</b> on the laptop once, then reload.</p>
      ${D && D.error ? `<p class="muted">Last error: ${esc(D.error)}</p>` : ""}</div>`;
    return;
  }
  const L = D.latest, V = L.verdict, S = L.suggestion;
  const pct = x => x == null ? "n/a" : (x * 100).toFixed(1) + "%";
  const usd = (x, d = 2) => x == null ? "n/a" : (x < 0 ? "-$" : "$") + Math.abs(x).toLocaleString(undefined, {minimumFractionDigits:d, maximumFractionDigits:d});
  const sgt = iso => new Date(iso).toLocaleString("en-SG", {timeZone:"Asia/Singapore", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
  function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  function whyBlock(S) {
    const C = S.conviction, Y = S.why;
    if (!C || !Y) return "";
    const low = C.label === "Low";
    return `<div class="why">
      <div class="conv ${C.label}"><div class="conv-top"><span class="lbl">Conviction: ${C.label}</span><span class="sc">${C.score}/100</span></div>
        <div class="meter" role="img" aria-label="Conviction ${C.score} out of 100"><b style="width:${C.score}%"></b><i style="left:${D.config?.conviction?.medium ?? 45}%"></i><i style="left:${D.config?.conviction?.high ?? 70}%"></i></div>
        <div class="conv-act"><b>${esc(C.action)}</b></div>
        ${C.caps.map(c => `<div class="muted">${esc(c)}</div>`).join("")}
        <details><summary>What drives the score</summary><table class="parts">
          ${C.parts.map(p => `<tr><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.why)}</span></td><td class="pt">${Math.round(p.weight * p.score)} / ${p.weight}</td></tr>`).join("")}
        </table></details></div>
      ${low ? `<p class="muted" style="margin:10px 0 0">It is fine not to trade. Below is why the rules picked this spread, so you can see what is missing.</p>` : ""}
      <h3>${low ? "Why it was considered" : "Why this trade"}: market conditions</h3><ul>${Y.market.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      <h3>How it fits your plan</h3><ul>${Y.goals.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
    </div>`;
  }

  const ageH = (Date.now() - new Date(D.last_good_at || L.generated_at)) / 36e5;
  let html = `<header><h1>SOL Vol Scanner</h1><div class="upd">Updated ${sgt(D.last_good_at || L.generated_at)} SGT<br>SOL ${usd(L.index_price)}</div></header>`;
  if (D.sample) html += `<div class="banner info"><b>Sample data.</b> These numbers are synthetic, made for testing. Run the scanner for real data.</div>`;
  if (D.status === "error") html += `<div class="banner warn"><b>Stale data.</b> The last run failed (${esc(D.error)}). Showing data from ${sgt(D.last_good_at)} SGT.</div>`;
  else if (ageH > 36 && !D.sample) html += `<div class="banner warn"><b>Stale data.</b> Last update was ${Math.round(ageH)} hours ago. Is the laptop's daily task running?</div>`;
  if (L.checks && L.checks.price_units && L.checks.price_units.ok === false) html += `<div class="banner warn">${esc(L.checks.price_units.note)}</div>`;

  // ---- verdict
  const metric = V.mode === "percentile"
    ? `<div class="stat"><div class="k">IV percentile</div><div class="v">${Math.round(V.percentile)}</div></div>`
    : `<div class="stat"><div class="k">IV / RV30 (bootstrap)</div><div class="v">${V.iv_rv_ratio ? V.iv_rv_ratio.toFixed(2) + "×" : "n/a"}</div></div>`;
  html += `<div class="grid${S ? "" : " no-greeks"}"><section class="card a-verdict"><h2><span class="step">1</span>Is volatility rich or cheap?</h2>
    <div class="vbody"><div class="verdict"><span class="badge ${V.label}">${V.label}</span>
      <div class="muted">${V.mode === "percentile" ? `vs ${V.history_days} days of IV history` : `${V.history_days || 0} of ${D.config?.vol?.min_history_days ?? 60} days of IV history collected — using IV vs realised vol until then`}</div></div>
    <div class="stats">
      <div class="stat"><div class="k">ATM implied vol (30-day)</div><div class="v">${pct(V.atm_iv)}</div></div>
      ${metric}
      <div class="stat"><div class="k">Realised vol, 20 days</div><div class="v">${pct(V.rv20)}</div></div>
      <div class="stat"><div class="k">Realised vol, 30 days</div><div class="v">${pct(V.rv30)}</div></div>
    </div></div>
    <div class="reason">${esc(V.reason)}</div></section>`;

  // ---- charts
  html += `<section class="card a-hist"><h2><span class="step">2</span>Implied vs realised volatility</h2>
    <div class="controls"><div class="seg" id="rng">${["1M","3M","6M","1Y"].map((r,i)=>`<button data-d="${[30,91,182,365][i]}" class="${r==="3M"?"on":""}">${r}</button>`).join("")}</div>
      <div class="seg"><button id="pricebtn" aria-pressed="false">SOL price</button></div></div>
    <div class="legend"><span><i style="background:var(--series-iv)"></i>Implied vol (30-day ATM)</span><span><i style="background:var(--series-rv)"></i>Realised vol (30-day)</span><span id="pricelegend" hidden><i style="background:var(--series-price)"></i>SOL price (lower panel)</span>
      <span><i class="band" style="background:var(--rich-band);outline:1px solid var(--rich)"></i>IV was rich</span><span><i class="band" style="background:var(--cheap-band);outline:1px solid var(--cheap)"></i>IV was cheap</span></div>
    <div class="chart" id="hist"></div>
    <div class="muted" id="histnote"></div></section>`;
  html += `<section class="card a-term"><h2><span class="step">3</span>Term structure (IV by expiry)</h2>
    <div class="legend"><span><i style="background:var(--series-iv)"></i>Today</span>${L.term_structure_last_week ? `<span><i style="background:var(--series-faded)"></i>${L.term_structure_last_week.date}</span>` : ""}</div>
    <div class="chart" id="term"></div>
    <div class="muted">Normally longer expiries cost more. If the short end sits above the long end, the market is stressed.</div></section>`;

  // ---- suggestion
  if (!S) {
    const W = L.why_no_trade || {market:[L.no_trade_reason], goals:[]};
    html += `<section class="card a-idea"><h2><span class="step">4</span>Today's idea</h2><div class="no-trade">No trade today</div>
      <div class="why" style="border-top:0;margin-top:4px;padding-top:0">
        <div class="conv None"><div class="conv-top"><span class="lbl">Conviction: none</span><span class="sc">no trade</span></div>
          <div class="conv-act">Sitting out is the right call today. Nothing passed the rules.</div></div>
        <h3>Market conditions</h3><ul>${W.market.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
        ${W.goals.length ? `<h3>How this fits your plan</h3><ul>${W.goals.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
      </div></section>`;
  } else {
    const z = S.sizing;
    html += `<section class="card a-idea"><h2><span class="step">4</span>Today's idea: bull put spread</h2>
      <div class="legs"><div><span class="act">Sell</span>${esc(S.short_leg.name)} <span class="muted">delta ${S.short_delta.toFixed(2)}</span></div>
      <div><span class="act">Buy</span>${esc(S.long_leg.name)}</div></div>
      <div class="kv">
        <div class="k">Expiry</div><div class="v">${S.expiry} (${Math.round(S.dte)} days)</div>
        <div class="k">Credit, conservative / mid</div><div class="v">${usd(S.credit_conservative)} / ${usd(S.credit_mid)} per SOL</div>
        <div class="k">Max loss</div><div class="v">${usd(S.max_loss)} per SOL</div>
        <div class="k">Break-even</div><div class="v">${usd(S.break_even)}</div>
        <div class="k">Approx. chance of profit</div><div class="v">${Math.round(S.prob_profit_approx * 100)}%</div>
        <div class="k">Size${D.config.risk.reference_sizing ? " (per $1,000 max loss)" : ""}</div><div class="v">${z.contracts} × ${S.contract_size} SOL</div>
        <div class="k">Total at risk / credit</div><div class="v">${usd(z.usd_at_risk)} / ${usd(z.credit_usd)}</div>
        <div class="k">Liquidity</div><div class="v">OI ≥ ${Math.round(S.liquidity.min_oi)} · spread ≤ ${Math.round(S.liquidity.worst_spread_pct)}%</div>
      </div>
      ${z.note ? `<div class="banner warn" style="margin-top:10px">${esc(z.note)}</div>` : ""}
      ${D.config.risk.reference_sizing ? `<div class="muted" style="margin-top:6px">Reference sizing: every size and dollar figure assumes a $1,000 max loss per trade (up to $3,000 across open spreads). Scale to your own size: risking $2,500 means 2.5× the contracts and dollars shown.</div>` : ""}
      <details class="tryl"><summary>Try different loss limits</summary>
        <div class="tl-grid">
          <label>Max loss per trade ($)<input id="tl-per" type="number" min="0" step="10" value="${D.config.risk.max_loss_per_trade_usd}"></label>
          <label>Max loss, all spreads ($)<input id="tl-tot" type="number" min="0" step="10" value="${D.config.risk.max_total_spread_risk_usd}"></label>
          <label>Already open ($)<input id="tl-open" type="number" min="0" step="10" value="${D.config.risk.current_open_risk_usd}"></label>
        </div>
        <div id="tl-out" class="tl-out"></div>
        <div class="muted">Preview only. To keep new limits, double-click <b>set_limits.bat</b> on the laptop, then rescan.</div>
      </details>
      <div class="chart" id="payoff" style="margin-top:10px"></div>
      <div class="muted">Payoff at expiry per SOL. Settles in USDC — to own more SOL, buy spot separately.</div>
      ${L.alternates && L.alternates.length ? `<details><summary>${L.alternates.length} alternate(s)</summary><table><tr><th>Expiry</th><th>Strikes</th><th>Credit</th><th>Max loss</th></tr>

      const n = pc > 0 ? Math.floor(budget / pc) : 0, sol = n * S.contract_size, credit = n * S.credit_conservative * S.contract_size;
      out.innerHTML = n ? `<b>${n} contract(s)</b> (${sol} SOL): ${usd(n * pc)} at risk, ${usd(credit)} credit ≈ ${(credit / L.index_price).toFixed(3)} SOL at today's price.`
        + (S.exit_plan ? ` With the stop: ≈ ${usd(S.exit_plan.loss_at_stop_usd / (S.sizing.contracts || 1) * n, 0)} if it fires.` : "")
        : `0 contracts: one contract risks ${usd(pc)}, but the budget is ${usd(budget)}.`;
    };
    [per, tot, opn].forEach(i => i && i.addEventListener("input", calc)); if (per) calc();
  }
  // Redraw charts when the window or a rotated tablet changes size
  let lastW = app.clientWidth, rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => {
    if (app.clientWidth === lastW) return; lastW = app.clientWidth; layoutCharts(); }, 150); });
  pb.onclick = () => { showPrice = !showPrice; try { localStorage.setItem("solvol.showPrice", showPrice ? "1" : "0"); } catch (e) {} syncPrice(); layoutCharts(); };
  document.querySelectorAll("#rng button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#rng button").forEach(o => o.classList.toggle("on", o === b)); days = +b.dataset.d; layoutCharts(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => location.reload());
})();
</script>
