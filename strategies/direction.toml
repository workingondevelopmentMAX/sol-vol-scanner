# Direction rules: a bullish / neutral / bearish reading for SOL, from committed data only (no look-ahead).
# DISPLAY ONLY for now: no live trade uses it. Later strategy files (bear call spread, iron condor, debit spreads)
# will read it. Versioned and fingerprinted like the strategy files.
#
# Every rule, threshold and the pass test below was fixed BEFORE any result was computed (committed on its own,
# 2026-11-20, owner choices: deep dip = bullish; crash/fear tested as fear days vs other days; thresholds as
# proposed). Do not tune these after seeing results: change = new version, judged on new days only.

[direction]
name = "direction"
title = "Direction signal: data factors tilted by the owner's view"
version = 1

# ------------------------------------------------------------------ candidate factors (tested)
# Each factor gives bullish / neutral / bearish for a day using only that day and earlier (daily SOL index closes
# and 30-day ATM IV from data/iv_history.csv). Before enough history exists it is "unknown" (left out of tests).

[factors.trend]
title = "Trend: SOL vs its 50-day and 200-day averages"
ma_short_days = 50
ma_long_days = 200
# bullish when SOL is above both averages, bearish when below both, otherwise neutral

[factors.momentum]
title = "Momentum: SOL's 30-day move"
lookback_days = 30
bullish_above_pct = 10        # 30-day move above +10% = bullish
bearish_below_pct = -10       # 30-day move below -10% = bearish

[factors.drawdown]
title = "Drawdown: how far SOL is below its 90-day high"
high_lookback_days = 90
bullish_below_high_pct = 30   # more than 30% below the 90-day high = bullish (a deep dip: buy the dip)
bearish_within_high_pct = 10  # within 10% of the 90-day high = bearish (stretched near highs)

[factors.crash_fear]
title = "Crash / fear day: sharp drop with a jump in implied vol"
drop_days = 5
drop_pct = 15                 # SOL down more than 15% over 5 days...
iv_rise_points = 15           # ...AND 30-day ATM IV up 15+ vol points over the same 5 days = "fear day"
fear_implies = "bullish"      # fixed before testing: buy the fear (bullish over the next 30 days)
one_sided = true              # only ever bullish or neutral; tested as fear days vs all other days (see [evaluation])

# ------------------------------------------------------------------ options-market factors (recording only)
# Need the stored daily option chains (data/chains/, from 2026-11-19), so there is not enough history to test them.
# Recorded every day in data/direction_history.csv; zero weight until they can be tested.

[factors.skew]
title = "Skew: put vs call implied vol at about 30 days"
recording_only = true
target_dte = 30
delta = 0.25                  # IV of the ~-0.25 delta put minus IV of the ~+0.25 delta call, in vol points
bearish_above_points = 10     # puts much dearer than calls = fear = bearish (for recording)
bullish_below_points = 0      # calls dearer than puts = bullish (for recording)

[factors.term_structure]
title = "Term structure: nearest-expiry ATM IV vs about 60-day ATM IV"
recording_only = true
long_target_dte = 60
bearish_inverted_points = 5   # short-dated IV above 60-day IV by more than 5 points = stress = bearish (for recording)
bullish_contango_points = 5   # short-dated IV below 60-day IV by more than 5 points = calm = bullish (for recording)

# ------------------------------------------------------------------ combining
[combine]
# data score = average of the factors that PASSED testing (bullish +1, neutral 0, bearish -1); none passed = 0.
view_tilt_per_strength = 0.15 # the owner's view adds +/-0.15 per strength point (1-3); expired view = neutral
bullish_at = 0.25             # final score >= +0.25 = bullish
bearish_at = -0.25            # final score <= -0.25 = bearish; otherwise neutral
# (so a strength-1 view alone stays neutral; strength 2 or more tips it.) Later strategy files may override the tilt.

# ------------------------------------------------------------------ the test, set in advance
[evaluation]
in_sample = ["2024-06-01", "2025-06-30"]   # same windows as strategies/bull_put_spread.toml
held_back = ["2025-07-01", ""]             # "" = up to the last day whose 30-day outcome is known
horizon_days = 30             # outcome: SOL's % move from the day's close to the close 30 calendar days later
outcome_inside_window = true  # a day counts only if its 30-day outcome also ends inside the same window
min_spread_points = 5         # PASS needs: average move when bullish minus when bearish >= +5 points...
min_periods = 4               # ...and >= 4 non-overlapping 30-day periods in each of bullish and bearish...
both_windows = true           # ...in BOTH windows.
# Non-overlapping periods: take the first day in a state, skip the next 30 days, take the next day in that state...
# One-sided factors (one_sided = true): the fear state is compared with all other days instead of bullish vs
# bearish: fear minus other >= +5 points, and >= 4 non-overlapping fear periods, in both windows.
# No weights are fitted: factors that pass count equally. Baseline reported: "always neutral" (all days).
