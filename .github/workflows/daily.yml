name: Daily SOL vol scan

# Runs every day at about 09:07 Singapore time (01:07 UTC), and whenever you press
# "Run workflow" in the Actions tab. Read-only: it only reads Deribit's public market data.
on:
  schedule:
    - cron: "7 1 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Also backfill past implied vol from Deribit trade history (first time: up to ~900 days, can take an hour or more)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "*.py", "config.toml", "strategies/**", "my_premium_log.csv", ".github/workflows/daily.yml"]

permissions:
  contents: write   # save the updated history and log back to the repository
  pages: write      # publish the dashboard
  id-token: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # a long backfill can take a while; a normal day takes about a minute
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover tests

      - name: Scan (keeps yesterday's data and shows a stale banner if Deribit is unreachable)
        id: scan
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.backfill }}" = "true" ]; then
            python main.py --backfill
          else
            python main.py
          fi

      - name: Backtest on the stored files, published to the dashboard (yesterday's evidence stays up if this fails)
        continue-on-error: true
        run: python backtest.py --publish

      - name: Refresh the page's evidence and cautions with today's backtest
        continue-on-error: true
        run: python report.py

      - name: Rebuild the Strategy Lab page's data
        continue-on-error: true
        run: python lab.py

      - name: Save history, log, today's option chain (data/chains/) and dashboard data
        run: |
          git config user.name "sol-vol-scanner bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/iv_history.csv data/term_history.json logs/suggestions.csv site/data/ data/backtest.json
          if [ -d data/chains ]; then git add data/chains/; fi
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Daily scan $(date -u +%Y-%m-%d)"
            # If another run saved data meanwhile, keep this run's files (they include everything older plus today).
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
