# SOL Vol Scanner - settings
# Edit the numbers, save, and they apply on the next run.
# Lines starting with # are notes and are ignored.

[risk]
# PUBLIC COPY: reference limits, not real ones. Every size on the dashboard is "per $1,000 of max loss":
# scale it to your own size in your head (e.g. risking $3,000 = 3x the contracts and dollars shown).
reference_sizing = true
portfolio_value_usd = 0
max_loss_per_trade_usd = 1000       # reference: $1,000 max loss per trade
max_total_spread_risk_usd = 3000    # reference: up to 3 trades open at once
current_open_risk_usd = 0

[vol]
iv_percentile_min = 50     # RICH when today's IV is at or above this percentile of history
iv_percentile_cheap = 20   # CHEAP when at or below this percentile
iv_rv_ratio_min = 1.2      # bootstrap mode (under 60 days of IV history): RICH when IV / RV30 >= this
iv_rv_ratio_cheap = 0.9    # bootstrap mode: CHEAP when IV / RV30 <= this
min_history_days = 60      # days of IV history needed before percentile mode switches on
target_dte = 30            # the "30-day" ATM IV we track

[spread]
dte_min = 14
dte_max = 42
short_delta_target = -0.20
short_delta_min = -0.25    # most negative delta allowed for the short put
short_delta_max = -0.15    # least negative delta allowed for the short put
long_strike_offset_pct = 10          # long put about this % below the short strike
min_credit_pct_of_width = 12         # conservative credit must be >= this % of strike width
                                     # (a ~20-delta put spread usually pays 10-17% of width;
                                     #  25% would need a ~30-delta short put or very rich IV)
max_leg_spread_pct_of_mid = 15       # each leg's bid-ask spread must be <= this % of its mid...
max_leg_spread_abs_usd = 0.10        # ...OR <= this many USDC per SOL (absolute floor)
min_open_interest = 0                # per leg, in SOL. Set after a first look at real data.
max_alternates = 2

[exits]
# The exit plan worked out for every idea (shown in step 5 of the dashboard).
take_profit_pct = 50          # buy the spread back once you've kept this % of the credit
split_take_profit = false     # true = take profit on half, let the other half run to expiry
stop_multiple = 1.5           # stop when the loss reaches this many times the credit (1, 1.5 or 2)
iv_points_per_pct_drop = 1.0  # assume implied vol rises this many points for each 1% SOL falls
stop_assumed_days = 3         # assume this many days have passed when the stop is hit
time_exit_dte = 7             # close anything still open this many days before expiry
stop_limit_buffer_pct = 30    # stop-limit price = trigger price + this % (room to get filled in a fast market)

[conviction]
# 0-100 score shown with every idea. Below "medium" the dashboard says skip today.
high = 70
medium = 45

[deribit]
base_url = "https://www.deribit.com/api/v2/public/"
index_name = "sol_usdc"
perp_instrument = "SOL_USDC-PERPETUAL"
instrument_prefix = "SOL_USDC-"
timeout_seconds = 15
min_seconds_between_calls = 0.15
keep_raw_cache_days = 14

[backfill]
# Approximate past ATM IV from Deribit's public trade history (each trade carries its IV).
# Deribit keeps full trade history on a separate host; the main API only has recent trades.
history_base_url = "https://history.deribit.com/api/v2/public/"
days = 90
windows_per_day = 4          # split each day into this many slices so trades are sampled across the day
max_pages_per_window = 5     # up to 1000 trades per page (USDC options include busy BTC/ETH linear options)
min_dte = 7
max_dte = 60
max_moneyness_pct = 10       # use trades with strikes within +/-10% of the index
min_trades_per_day = 2
